<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101426">
    <title>Button &amp; Popup</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101426;
            color: #f5f7ff;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(111, 95, 255, 0.2), transparent 52%),
                #101426;
        }

        .page {
            width: min(100%, 620px);
            padding: clamp(32px, 8vw, 72px) 24px;
            text-align: center;
            animation: page-enter 700ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #a99fff;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 750;
            letter-spacing: -0.065em;
            line-height: 1.05;
        }

        .description {
            max-width: 420px;
            margin: 20px auto 34px;
            color: #a5abc0;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .open-button {
            position: relative;
            display: inline-flex;
            min-height: 58px;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 16px;
            background: linear-gradient(135deg, #8b7bff, #6356e8 55%, #5145cc);
            box-shadow: 0 12px 32px rgba(99, 86, 232, 0.34), inset 0 1px rgba(255, 255, 255, 0.28);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .open-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 17px 38px rgba(99, 86, 232, 0.46), inset 0 1px rgba(255, 255, 255, 0.3);
            filter: brightness(1.08);
        }

        .open-button:active {
            transform: translateY(0) scale(0.98);
        }

        .open-button:focus-visible,
        .close-button:focus-visible {
            outline: 3px solid #c9c2ff;
            outline-offset: 4px;
        }

        .button-arrow {
            font-size: 1.2rem;
            transition: transform 180ms ease;
        }

        .open-button:hover .button-arrow {
            transform: translateX(4px);
        }

        .hint {
            margin: 18px 0 0;
            color: #7f879f;
            font-size: 0.84rem;
        }

        .popup {
            width: min(440px, calc(100% - 32px));
            max-width: none;
            max-height: min(90vh, 680px);
            margin: auto;
            padding: 0;
            overflow: auto;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            background: #1a2035;
            box-shadow: 0 32px 100px rgba(0, 0, 0, 0.55);
            color: #f5f7ff;
            opacity: 0;
            transform: translateY(18px) scale(0.96);
            transition: opacity 240ms ease, transform 300ms cubic-bezier(.2, .8, .2, 1), overlay 300ms allow-discrete, display 300ms allow-discrete;
        }

        .popup[open] {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        @starting-style {
            .popup[open] {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }
        }

        .popup::backdrop {
            background: rgba(5, 8, 18, 0.72);
            opacity: 0;
            transition: opacity 240ms ease, overlay 300ms allow-discrete, display 300ms allow-discrete;
        }

        .popup[open]::backdrop {
            opacity: 1;
        }

        @starting-style {
            .popup[open]::backdrop {
                opacity: 0;
            }
        }

        .popup-content {
            padding: 42px 36px 36px;
            text-align: center;
        }

        .success-icon {
            display: grid;
            width: 68px;
            height: 68px;
            margin: 0 auto 24px;
            place-items: center;
            border: 1px solid rgba(141, 255, 208, 0.24);
            border-radius: 22px;
            background: linear-gradient(145deg, rgba(86, 225, 169, 0.2), rgba(86, 225, 169, 0.06));
            color: #76efbd;
            font-size: 2rem;
            animation: icon-pop 420ms 100ms cubic-bezier(.2, 1.5, .5, 1) both;
        }

        .popup h2 {
            margin: 0 0 12px;
            font-size: 1.8rem;
            letter-spacing: -0.04em;
        }

        .popup p {
            margin: 0;
            color: #a5abc0;
            font-size: 0.98rem;
            line-height: 1.7;
        }

        .close-button {
            width: 100%;
            min-height: 50px;
            margin-top: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.08);
            color: #f5f7ff;
            cursor: pointer;
            font: inherit;
            font-weight: 650;
            transition: background 180ms ease, transform 180ms ease;
        }

        .close-button:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.14);
        }

        @keyframes page-enter {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes icon-pop {
            from { opacity: 0; transform: scale(0.65) rotate(-12deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @media (max-width: 480px) {
            body { padding: 16px; }
            .popup-content { padding: 34px 24px 26px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <script src="button-pop.js" defer></script>
</head>
<body>
    <main class="page">
        <p class="eyebrow">A little interaction</p>
        <h1>Make it a moment.</h1>
        <p class="description">A polished popup, ready when you are. Click the button to see it in action.</p>
        <button class="open-button" id="openPopup" type="button" aria-haspopup="dialog" aria-controls="welcomePopup">
            <span>Open the popup</span>
            <span class="button-arrow" aria-hidden="true">→</span>
        </button>
        <p class="hint">Press Escape or click outside to close.</p>
    </main>

    <dialog class="popup" id="welcomePopup" aria-labelledby="popupTitle" aria-describedby="popupDescription">
        <div class="popup-content">
            <div class="success-icon" aria-hidden="true">✓</div>
            <h2 id="popupTitle">Well, hello there!</h2>
            <p id="popupDescription">Your button works beautifully. This popup is ready to welcome visitors, share a message, or celebrate a success.</p>
            <button class="close-button" id="closePopup" type="button">Lovely, thanks</button>
        </div>
    </dialog>
</body>
</html>
